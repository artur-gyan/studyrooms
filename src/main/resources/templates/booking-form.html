<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>New Booking</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 700px;
            margin: 50px auto;
            padding: 20px;
            background-color: #f5f5f5;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        h1 {
            color: #333;
            border-bottom: 3px solid #4CAF50;
            padding-bottom: 15px;
            margin-bottom: 30px;
        }
        .error-message {
            background-color: #ffebee;
            color: #c62828;
            padding: 15px 20px;
            border-radius: 5px;
            border-left: 5px solid #c62828;
            margin: 20px 0;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .form-group {
            margin: 25px 0;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
            font-size: 15px;
        }
        input[type="date"],
        input[type="time"] {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #ddd;
            border-radius: 6px;
            font-size: 15px;
            box-sizing: border-box;
            transition: border-color 0.3s;
        }
        input[type="date"]:focus,
        input[type="time"]:focus {
            outline: none;
            border-color: #4CAF50;
            box-shadow: 0 0 0 3px rgba(76, 175, 80, 0.1);
        }
        .button-group {
            margin-top: 35px;
            display: flex;
            gap: 15px;
        }
        .btn {
            padding: 14px 28px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            text-decoration: none;
            display: inline-block;
            text-align: center;
            transition: all 0.3s;
            flex: 1;
        }
        .btn-primary {
            background-color: #4CAF50;
            color: white;
        }
        .btn-primary:hover {
            background-color: #45a049;
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(76, 175, 80, 0.3);
        }
        .btn-secondary {
            background-color: #666;
            color: white;
        }
        .btn-secondary:hover {
            background-color: #555;
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }
        .room-info {
            background: linear-gradient(135deg, #e8f5e9 0%, #c8e6c9 100%);
            padding: 20px;
            border-radius: 8px;
            margin: 25px 0;
            border-left: 5px solid #4CAF50;
        }
        .room-info h3 {
            margin-top: 0;
            color: #2e7d32;
            font-size: 18px;
        }
        .info-row {
            display: flex;
            margin: 8px 0;
            align-items: center;
        }
        .info-label {
            font-weight: 600;
            color: #1b5e20;
            min-width: 140px;
        }
        .info-value {
            color: #333;
        }
    </style>
</head>
<body>
<div class="container">
    <h1> New Booking</h1>

    <div class="room-info">
        <h3> Room Details</h3>
        <div class="info-row">
            <span class="info-label">Room:</span>
            <span class="info-value" th:text="${room.name}"></span>
        </div>
        <div class="info-row">
            <span class="info-label">Description:</span>
            <span class="info-value" th:text="${room.description} ?: 'No description'"></span>
        </div>
        <div class="info-row">
            <span class="info-label">Capacity:</span>
            <span class="info-value" th:text="${room.capacity} + ' people'"></span>
        </div>
        <div class="info-row">
            <span class="info-label">Operating Hours:</span>
            <span class="info-value">
                    <span th:text="${room.openTime}"></span> - <span th:text="${room.closeTime}"></span>
                </span>
        </div>
    </div>

    <div th:if="${errorMessage}" class="error-message">
        <span style="font-size: 20px;">⚠️</span>
        <div>
            <strong>Error:</strong> <span th:text="${errorMessage}"></span>
        </div>
    </div>

    <form th:action="@{/bookings}" th:object="${bookingForm}" method="post">
        <!-- roomId hidden -->
        <input type="hidden" th:field="*{roomId}"/>

        <div class="form-group">
            <label for="date"> Date:</label>
            <input id="date" type="date" th:field="*{date}" required>
        </div>

        <div class="form-group">
            <label for="startTime"> Start Time:</label>
            <input id="startTime" type="time" th:field="*{startTime}" required>
        </div>

        <div class="form-group">
            <label for="endTime"> End Time:</label>
            <input id="endTime" type="time" th:field="*{endTime}" required>
        </div>

        <div class="button-group">
            <button type="submit" class="btn btn-primary">✓ Create Booking</button>
            <a th:href="@{/rooms}" class="btn btn-secondary">✕ Cancel</a>
        </div>
    </form>
</div>
</body>
</html>
